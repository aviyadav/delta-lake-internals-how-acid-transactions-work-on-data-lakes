version: 2

models:
  - name: gold_customer_orders
    description: One row per customer with spend and order counts.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: total_orders
        tests:
          - not_null
      - name: lifetime_value
        tests:
          - not_null

  - name: gold_daily_revenue
    description: Daily revenue rollup used by the finance dashboard.
    columns:
      - name: order_date
        tests:
          - unique
          - not_null
      - name: realized_revenue
        tests:
          - not_null
